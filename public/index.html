<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Network Dashboard</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0d0d0d">
    <link rel="stylesheet" href="/css/dashboard.css">
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="top-left">
          <span id="summary"></span>
          <span id="demo-badge" class="chip warn hidden" title="Showing generated data – create config.json to use your devices"><i>▲</i>Demo data</span>
          <span class="offline-badge chip crit"><i>✕</i>Dashboard server unreachable</span>
        </div>
        <div class="top-center">
          <div id="clock"></div>
          <div id="date"></div>
        </div>
        <div class="top-right" id="header-weather"></div>
      </header>
      <main id="grid" class="grid"></main>
    </div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
