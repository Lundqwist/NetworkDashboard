<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Ndb – Network Dashboard</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262623"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="244" height="244" rx="52" fill="url(#bg)" stroke="#3987e5" stroke-width="8"/>
  <g transform="translate(128 130) scale(0.82) translate(-128 -130)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="22">
      <!-- N: a link between two network nodes -->
      <path d="M12 194 V66 L62 194 V66" stroke="#3987e5"/>
      <!-- d and b: mirrored pair -->
      <circle cx="119" cy="164" r="30" stroke="#f0efec"/>
      <path d="M149 66 V194" stroke="#f0efec"/>
      <path d="M179 66 V194" stroke="#f0efec"/>
      <circle cx="209" cy="164" r="30" stroke="#f0efec"/>
    </g>
    <g stroke="#111110" stroke-width="7">
      <circle cx="12" cy="194" r="17" fill="#3987e5"/>
      <circle cx="62" cy="66" r="17" fill="#3987e5"/>
      <circle cx="179" cy="60" r="17" fill="#0ca30c"/>
    </g>
  </g>
</svg>
